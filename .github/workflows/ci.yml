name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.15'
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --locked --extra dev make check
      - run: uv run --locked --extra dev make examples
      - run: uv run --locked --extra dev make build
      - name: Smoke test installed wheel outside the source tree
        shell: bash
        run: |
          uv venv /tmp/ricci-wheel --python 3.12
          uv pip install --python /tmp/ricci-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/ricci-wheel/bin/python -c 'import ricci; from ricci.backends.torch import contract; print(ricci.__version__)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-and-coverage
          path: |
            dist/
            coverage.xml
          retention-days: 14

  compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.15'
          enable-cache: true
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --locked --extra dev python -m pytest
      - run: uv run --locked --extra dev python examples/attention.py
